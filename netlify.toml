# Netlify configuration — labwestrealty-site

# ═══ Security headers (2026-04-15) ═══

# ═══ Deploy-skip for backend-only commits (2026-08-24, Netlify credit-usage
# fix, ported from Gander's 2026-06-27 / Conv #122 Mike-approved original)
# ═══
# SKIP the Netlify deploy when a commit touched ONLY backend tooling
# (tools/, .github/) — CI scripts, workflow edits, etc: none change the live
# site. ALWAYS deploy on any served-content change, or if
# tools/idx-cache/listings-projected.json changed (this site has no IDX
# pipeline today, so that carve-out is inert here, but the block stays
# byte-consistent with Gander/Avalon/Goosebay per Convention #15). Errs
# toward BUILDING on ANY uncertainty (no cached ref / shallow clone / git
# error / empty diff).
[build]
  ignore = """
[ -z "$CACHED_COMMIT_REF" ] && exit 1
D=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" 2>/dev/null) || exit 1
[ -z "$D" ] && exit 1
echo "$D" | grep -qvE "^(tools/|[.]github/)" && exit 1
echo "$D" | grep -qxF "tools/idx-cache/listings-projected.json" && exit 1
exit 0
"""

[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, include subdomains, allow preload-list submission
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Prevent MIME sniffing attacks
    X-Content-Type-Options = "nosniff"
    # Prevent clickjacking — only same-origin may iframe these pages
    X-Frame-Options = "SAMEORIGIN"
    # Minimize referer leakage to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny device APIs we don't use
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"
    # Cross-origin isolation — conservative defaults
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # Content-Security-Policy REMOVED 2026-04-15 — was breaking RealtyVis widget fetches.
    # Re-add once RealtyVis provides the complete list of origins their widget calls.
