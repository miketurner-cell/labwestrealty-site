explainers:
  units_sold: "The total number of homes that closed during this period. Labrador West is a small market, so individual sales move the averages."
  avg_sale_price: "The average price buyers paid for homes. This includes all residential property types in Labrador City and Wabush."
  sale_to_list: "Measures how close homes sell to their asking price. 100% means sellers get exactly what they ask. Below 95% means buyers have negotiating room."
  days_on_market: "How long the typical home sits before selling."
  sold_at_100: "Homes that sold at or above the listed price."
  yoy_comparison: "These arrows compare this year to the same period last year using the same calendar window, so the comparison is fair and not affected by seasonal timing."
  monthly_spotlight: "A single month in a market this size can turn on a few sales, so treat this as a snapshot rather than a trend."
  price_bands: "Where the activity sits by price point, over the trailing twelve months. Bands with too few sales are left out."
  property_type_mix: "Median price is used here rather than average so one unusually expensive sale does not distort a small category. Categories with fewer than five sales in the past year are left out."
  community_snapshot: "Year-to-date results for Labrador City and Wabush."
