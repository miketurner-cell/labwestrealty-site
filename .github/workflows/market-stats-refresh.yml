name: Lab West market statistics refresh

# Counts and days on market for Labrador City / Wabush, regenerated into /market-stats.html (sites, D-1021-31).
#
# DISPATCH ONLY, NO SCHEDULE, NO RETS LOGIN. Lab West has no NLAR login (one login per account, ReplyCode 20022), so it reads the three
# Lab West regions from Avalon's committed tools/idx-cache/live-aggregates.json (Avalon's nightly reads the whole-board sold cache),
# strips every sold-price key (tools/labwest-stats-refresh.py) and renders through build-market-stats-page.py --output-root
# (counts only, complete months only, "Data through <date>" on the page).
#
# NEEDS ONE SECRET THAT DOES NOT EXIST YET: SIBLING_REPO_PAT on this repo (read-only, contents:read on avalonrealestate-site), the same
# read-only pattern Gander's workflows use. Without it the run stops at the first step with a plain message; nothing is written.
#
# `commit` defaults to false: the page is built, tested and uploaded as an artifact only. true commits market-stats.html alone.
# A cadence belongs in realestategander-site tools/runner/schedules.json (box dispatch); none is registered here.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit market-stats.html to the branch (false = build and test only, upload the page as an artifact)"
        type: boolean
        default: false

concurrency:
  group: labwest-market-stats-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  refresh:
    name: Avalon aggregates -> Lab West page
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: The read-only sibling token must exist
        env:
          PAT: ${{ secrets.SIBLING_REPO_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::SIBLING_REPO_PAT is not set on this repository. It must be a read-only token (contents:read on miketurner-cell/avalonrealestate-site). Nothing was read or written."
            exit 1
          fi

      - name: Checkout Lab West
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Checkout Avalon's committed aggregates (one file, read-only)
        uses: actions/checkout@v4
        with:
          repository: miketurner-cell/avalonrealestate-site
          ref: main
          token: ${{ secrets.SIBLING_REPO_PAT }}
          path: _avalon
          fetch-depth: 1
          sparse-checkout: tools/idx-cache/live-aggregates.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take the three Lab West regions, strip prices, drop part-years
        run: python3 tools/labwest-stats-refresh.py --sibling _avalon/tools/idx-cache/live-aggregates.json --max-age-days 3

      - name: Render /market-stats.html
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/build-market-stats-page.py --all --output-root --verbose

      - name: Checks before anything is committed
        run: |
          python3 tools/tests/sold-figures-guard.py
          python3 tools/tests/dev-wording-visible-test.py
          python3 tools/seo-safety-check.py

      - name: Upload the page
        uses: actions/upload-artifact@v4
        with:
          name: market-stats
          path: market-stats.html

      - name: Commit market-stats.html (only when asked, only when it changed)
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "Turner DDF Bot"
          git config user.email "ddf-bot@royallepageturner.com"
          git add -- market-stats.html
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Lab West market statistics refresh (counts and days on market only)"
          _br="${GITHUB_REF#refs/heads/}"
          _ok=0
          for _attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$_br" && git push origin "HEAD:$_br"; then _ok=1; echo "pushed (attempt $_attempt)"; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 8 + 4))
          done
          [ "$_ok" = 1 ] || { echo "::error::push failed after 5 attempts"; exit 1; }
