name: Pre-deploy quality check

# Lab West CI skeleton (sites, D-1012-34, component 1). Ported in spirit from
# goosebayrealestate-site's pre-deploy.yml, deliberately lean: the repo-level checks that
# exist here today plus the Lab West switch tests. Each later component adds its STRICT
# steps below, in order.
#
# THE SWITCH: repo variable LABWEST_LISTINGS (off | preview | on). It is Mike's, by name and
# value. Unset = off. This workflow never reads RETS and never writes: it only validates
# served content, and it prints the switch value on every run (positive heartbeat).

on:
  push:
    branches: [main, master]
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "images/**"
      - "_redirects"
      - "netlify.toml"
      - "sitemap*.xml"
      - "robots.txt"
      - "tools/**"
      - ".github/workflows/pre-deploy.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: pre-deploy-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  switch:
    # Cheap first step for every Lab West workflow. Lab West has no self-hosted runner,
    # so this job is always hosted. A scheduled/pulling workflow copies this job and gates
    # on needs.switch.outputs.state == 'on' BEFORE any RETS login.
    name: Lab West switch
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.read.outputs.state }}
    steps:
      - name: Read LABWEST_LISTINGS
        id: read
        env:
          RAW: ${{ vars.LABWEST_LISTINGS }}
        run: |
          s="${RAW:-off}"
          case "$s" in on|preview|off) ;; *) s=off ;; esac
          echo "state=$s" >> "$GITHUB_OUTPUT"
          echo "LABWEST_LISTINGS=$s (unset or unrecognised = off). Nothing is pulled or generated by this workflow."

  pre-deploy:
    name: Pre-deploy check
    needs: switch
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    # Fork-PR guard (same as the other sites): a self-hosted runner has no per-job isolation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Full-site pre-deploy check (STRICT — errors block, warnings allowed)
        run: python3 tools/pre-deploy-check.py

      - name: Recruiting pages carry the shared technology block unchanged, confirmed claims only (STRICT, D-1012-35)
        run: |
          python3 tools/sync-recruiting-tech.py --check
          python3 tools/tests/recruiting-block-test.py

      - name: SEO safety check (STRICT — a live page may not lose title, canonical, index status or sitemap entry)
        run: python3 tools/seo-safety-check.py

      - name: Award wording and region registry (STRICT)
        run: |
          python3 tools/check-award-wording.py
          python3 tools/regions_check.py

      - name: Lab West switch is wired dark (STRICT — every workflow gates on LABWEST_LISTINGS before any pull)
        run: python3 tools/tests/labwest-switch-test.py

      - name: Install feed-tool imports (the scope test imports the ingest and photo-sync tools)
        run: python3 -m pip install --quiet requests Pillow pyyaml

      - name: Lab West feed scope, lease drop and site config (STRICT — Labrador City + Wabush only, no leases, R2 prefix labwest/)
        run: python3 tools/tests/labwest-scope-test.py

      - name: Lab West listing pages - dark while off, homes only, no leases, Mike as the contact, state script (STRICT)
        run: python3 tools/tests/labwest-listings-test.py

      - name: No Lab West street address anywhere (STRICT)
        run: python3 tools/tests/labwest-no-address-test.py

      - name: Feed field list equals Gander's (STRICT)
        run: python3 tools/tests/idx-fields-parity-test.py

      - name: Header, nav and feedback tests (STRICT)
        run: |
          node tools/tests/header-v2-test.mjs
          node tools/tests/header-nosearch-test.mjs
          node tools/tests/nav-partner-label-test.mjs
          node tools/tests/site-feedback-test.mjs
          node tools/tests/feedback-followup-test.mjs

      - name: Sold data behind sign-in - dark guard, 401 when signed out, no price in the single row (STRICT)
        run: node tools/tests/labwest-sold-data-test.mjs

      - name: Nightly pieces - aggregates match the rows, market page says what it runs through, no Goose Bay or Gander (STRICT)
        run: python3 tools/tests/labwest-nightly-test.py

      - name: Chat - dark guard (404 with no data), Lab West origin allow-list, Mike as the one contact, nothing called out (STRICT)
        run: node tools/tests/labwest-chat-test.mjs

      - name: Existing seo-safety-check test (STRICT)
        run: python3 tools/tests/seo-safety-check-test.py

      - name: No development wording in visible text of the committed pages (STRICT)
        run: python3 tools/tests/dev-wording-visible-test.py

      - name: Sold sign-in card has a way out and the sold price stays gated (STRICT)
        run: python3 tools/tests/sold-gate-way-out-test.py

      - name: Test set complete, raw feed private, workflows dispatch-only, switch never set (STRICT)
        run: python3 tools/tests/labwest-registry-test.py

      - name: Post-deploy live check works offline, read-only, no alert channel (STRICT, D-1021-07)
        run: python3 tools/tests/post-deploy-live-check-test.py

  # D-1021-07 (Mike, 2026-10-21, "Post-deploy live check (Recommended)"): after a push to main, wait for Netlify and check what a signed-out
  # visitor gets. A job here, not a new workflow, because labwest-registry-test.py (3) keeps every other workflow dispatch-only. Read-only
  # (plain GETs; no secret, because labwest-switch-test keeps pre-deploy.yml secret-free); the alert is this run going red. No hourly schedule: Lab West has no scheduled deploy.
  live-check:
    name: Post-deploy live check (signed out)
    if: github.event_name == 'push'
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: Live check (signed out, read-only)
        env:
          NETLIFY_SITE_ID: baec4161-22ca-483e-afcc-65f15fbfc696   # LabWest (not a secret)
        run: python3 tools/post-deploy-live-check.py --site labwest --wait 1200
